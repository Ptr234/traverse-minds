# Traverse Minds submissions stack: Postgres + API + HTTPS.
#   cp .env.example .env   # fill in secrets
#   docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: traverseminds
      POSTGRES_USER: traverseminds
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No ports published: only the API can reach the database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traverseminds -d traverseminds"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://traverseminds:${POSTGRES_PASSWORD}@db:5432/traverseminds
      INGEST_TOKEN: ${INGEST_TOKEN:?set INGEST_TOKEN in .env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  # Nightly pg_dump, keeps the last 14 days in ./backups
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do
        pg_dump -h db -U traverseminds -d traverseminds -Fc -f /backups/traverseminds-$$(date +%F).dump &&
        find /backups -name "*.dump" -mtime +14 -delete;
        sleep 86400;
      done'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
