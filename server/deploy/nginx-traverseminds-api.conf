# /etc/nginx/sites-available/traverseminds-api
# HTTP only at first; `sudo certbot --nginx -d api.traverseminds.ug` adds the HTTPS block and redirect.
server {
    listen 80;
    listen [::]:80;
    server_name api.traverseminds.ug;

    client_max_body_size 1m;   # submissions are small JSON; CVs are emailed, never sent here

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Set from the TCP peer, overwriting anything the client sent (used for login rate limiting)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
